name: XRP live safety tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependency
        run: pip install requests
      - name: Compile live adapter
        run: python -m py_compile okx_live.py
      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v
