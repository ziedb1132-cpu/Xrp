name: XRP AI 100-cycle runner
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: xrp-paper-engine
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore split state if present
        run: python state_storage.py restore
      - name: Validate code and feature schema
        run: |
          python -m compileall -q ai_model.py feature_engine.py news_engine.py run_cycle.py signal_manager.py xrp_engine.py state_storage.py strategy_engine.py okx_live.py
          python - <<'PY'
          from feature_engine import build_features
          from ai_model import gate_status
          from strategy_engine import evaluate_strategies
          candles=[]
          for i in range(300):
              p=100+i*0.02
              candles.append({"ts":i,"o":p-0.01,"h":p+0.05,"l":p-0.05,"c":p,"vol":1000+i})
          features=build_features(candles,{"trend":0.01,"volatility":0.002},{"imbalance":0.1,"spread_pct":0.02},0.05)
          assert len(features)==1205, f"Expected 1205 features, got {len(features)}"
          assert len(evaluate_strategies(candles))==8, "Expected 8 strategy families"
          sample={k:0.001 for k in features}
          wins=[{"status":"TP","net_return_pct":0.5,"entry":1.0,"high_water":1.03,"low_water":0.995,
                 "features":sample,"feature_version":"xrp-1200-v2"} for _ in range(30)]
          losses=[{"status":"SL","net_return_pct":-0.5,"entry":1.0,"high_water":1.005,"low_water":0.97,
                   "features":sample,"feature_version":"xrp-1200-v2"} for _ in range(30)]
          balanced=wins+losses
          assert not gate_status(wins+losses[:29])["enabled"], "AI gate opened before 30 wins and 30 losses"
          assert gate_status(balanced)["enabled"], "AI gate did not open at 30 balanced wins/losses"
          invalid=dict(sample);invalid[next(iter(invalid))]=float("nan")
          bad=[{"status":"TP","net_return_pct":0.5,"entry":1.0,"high_water":1.03,"low_water":0.995,
                "features":invalid,"feature_version":"xrp-1200-v2"} for _ in range(30)]
          assert not gate_status(bad+losses)["enabled"], "AI gate accepted non-finite features"
          wrong=[{"status":"TP","net_return_pct":0.5,"entry":1.0,"high_water":1.03,"low_water":0.995,
                  "features":sample,"feature_version":"wrong-version"} for _ in range(30)]
          assert not gate_status(wrong+losses)["enabled"], "AI gate accepted an incompatible feature version"
          print("PREFLIGHT_OK features=1205 strategies=8 ai_gate=30wins+30losses finite/version_checked")
          PY
      - name: Execute 100 cycles and persist every cycle
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          XRP_LIVE_TRADING_ENABLED: ${{ vars.XRP_LIVE_TRADING_ENABLED || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in $(seq 1 100); do
            python run_cycle.py
            python state_storage.py pack

            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Persist XRP cycle $i [skip ci]"
            fi

            pushed=0
            delay=2
            for attempt in $(seq 1 8); do
              # Rebase the saved cycle onto the newest main before every push.
              git fetch --no-tags origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "PERSIST_REBASE_FAILED cycle=$i attempt=$attempt"
                exit 1
              fi

              if git push origin HEAD:main; then
                pushed=1
                echo "PERSIST_OK cycle=$i attempt=$attempt"
                break
              fi

              echo "PERSIST_RETRY cycle=$i attempt=$attempt wait=${delay}s"
              sleep "$delay"
              if [ "$delay" -lt 60 ]; then delay=$((delay * 2)); fi
            done

            if [ "$pushed" -ne 1 ]; then
              echo "PERSIST_PUSH_FAILED cycle=$i; local state will be uploaded as a recovery artifact"
              exit 1
            fi
            sleep 60
          done

          gh workflow run xrp-cycle.yml --repo "$GH_REPOSITORY" --ref main

      - name: Upload recovery state if persistence fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xrp-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            xrp_state.json
            xrp_summary.json
            strategy_history.json
            xrp_live_state.json
            xrp_model.pt
            xrp_exit_policy.pt
            *.parts/
            *.parts.json
          if-no-files-found: warn
          retention-days: 14
